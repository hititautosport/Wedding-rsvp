<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Planner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wedding">
<meta name="theme-color" content="#FBF8F3">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F3; --card:#FFFFFF; --ink:#2E2A26; --muted:#8A8178; --line:#ECE4D8;
  --sage:#6F8470; --sage-soft:#E7EDE6; --blush:#C08A78; --blush-soft:#F6E9E3;
  --gold:#B39361; --red:#B5523F; --red-soft:#F8E4DF;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
header{padding:calc(env(safe-area-inset-top) + 18px) 20px 6px;text-align:center}
header .names{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;letter-spacing:.3px;cursor:pointer}
header .sub{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
main{padding:8px 16px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:20}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--muted);padding:4px 10px;cursor:pointer;font-weight:500}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav button.on{color:var(--blush)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.hero{text-align:center;padding:22px 16px;background:linear-gradient(160deg,#fff 0%,var(--blush-soft) 100%)}
.hero .label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.hero .big{display:flex;justify-content:center;gap:14px;margin:10px 0 4px}
.hero .big div{min-width:58px}
.hero .big b{display:block;font-family:"Cormorant Garamond",serif;font-size:44px;line-height:1;font-weight:600}
.hero .big span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.hero .when{color:var(--muted);font-size:13px}
h2{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;margin:22px 4px 4px;display:flex;align-items:center;justify-content:space-between}
h3{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:13px;white-space:nowrap}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--sage-soft);color:var(--sage);font-weight:600;white-space:nowrap}
.chip.blush{background:var(--blush-soft);color:var(--blush)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.gray{background:#F1EEE9;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .v{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;line-height:1.1}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat.wide{grid-column:1/-1}
.bar{height:8px;border-radius:99px;background:#F1EEE9;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px}
.bar i.over{background:var(--red)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.blush{background:var(--blush)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red-soft)}
.btn:disabled{opacity:.5}
.add{background:var(--blush);color:#fff;border:0;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;font-family:Inter}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;background:#fff;cursor:pointer}
.check.on{background:var(--sage);border-color:var(--sage)}
.check.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}
.banner{background:var(--blush-soft);color:#7a4d40;border-radius:12px;padding:10px 14px;font-size:13px;margin:8px 0}
.money{font-variant-numeric:tabular-nums}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(46,42,38,.35);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);z-index:41;
  border-radius:22px 22px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);display:none;max-width:640px;margin:0 auto}
.sheet.open,.veil.open{display:block}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 10px}
.sheet h4{font-family:"Cormorant Garamond",serif;font-size:24px;margin:4px 0 12px;font-weight:600}
.f{margin:0 0 12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;min-height:44px}
.f textarea{min-height:70px;resize:vertical}
.f.cb{display:flex;align-items:center;gap:10px}
.f.cb input{width:22px;height:22px;min-height:0;accent-color:var(--sage)}
.f.cb label{margin:0;font-size:14px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions{display:flex;gap:10px;margin-top:8px}
.sheet .actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;max-width:90vw;display:none}
.note{font-size:12.5px;color:var(--muted);margin:6px 4px}
.login{max-width:360px;margin:40px auto 0;text-align:center}
.login .mono{width:84px;height:84px;border-radius:50%;border:1.5px solid var(--blush);display:grid;place-items:center;margin:0 auto 14px;font-family:"Cormorant Garamond",serif;font-size:46px;color:var(--blush)}
.login input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:17px;text-align:center;margin:14px 0 10px}
a{color:var(--blush)}
</style>
</head>
<body>
<header>
  <div class="names" id="names" title="Tap to edit">Our Wedding</div>
  <div class="sub" id="subline">Planner</div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<nav id="nav"></nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

function parseD(d,t){if(!d)return null;const x=new Date(d+'T'+(t||'00:00'));return isNaN(x)?null:x}
function today0(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function daysUntil(d){const x=parseD(d);if(!x)return null;return Math.round((x-today0())/864e5)}
function niceDate(d,t){const x=parseD(d,t);if(!x)return 'Date not set';
  let s=x.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  if(t)s+=' · '+x.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});return s}
function dueChip(d,doneish){const n=daysUntil(d);if(n===null)return '';
  if(doneish)return '';
  if(n<0)return `<span class="chip red">${-n}d late</span>`;
  if(n===0)return `<span class="chip blush">Today</span>`;
  if(n<=14)return `<span class="chip blush">${n}d</span>`;
  return `<span class="chip gray">${n}d</span>`}
function wedding(){return S.events.find(e=>e.kind==='Wedding')}
function addMonths(d,m){const x=new Date(d);if(Number.isInteger(m))x.setMonth(x.getMonth()+m);else x.setDate(x.getDate()+Math.round(m*30));return x}
function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}

function qtyOf(b){return b.perGuest?guestCount():(b.qty===''||b.qty==null?null:num(b.qty))}
function itemCost(b){const q=qtyOf(b);if(b.price===''||b.price==null||q===null)return 0;return num(b.price)*q}
function itemPays(id){return S.payments.filter(p=>p.itemId===id)}

function nextDue(id){const u=itemPays(id).filter(p=>!p.paid&&p.due).map(p=>p.due).sort();return u[0]||''}

function rsvpUrl(ev){const b=(S.settings.rsvpBase||RSVP_DEFAULT).trim();return b+(b.includes('?')?'&':'?')+'e='+ev}
function qrSVG(text){let m;try{m=QRLib.matrix(text,'M')}catch(_){return ''}const n=m.length,q=4,sz=n+q*2;let d='';
  m.forEach((row,r)=>row.forEach((on,c)=>{if(on)d+=`M${c+q} ${r+q}h1v1h-1z`}));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sz} ${sz}" shape-rendering="crispEdges" style="width:100%;max-width:260px;display:block;margin:0 auto"><rect width="${sz}" height="${sz}" fill="#fff"/><path d="${d}" fill="#2E2A26"/></svg>`}
function qrImg(text){const svg=qrSVG(text);if(!svg)return '';return `<img alt="QR code" src="data:image/svg+xml;base64,${btoa(svg)}" style="width:100%;max-width:260px;display:block;margin:0 auto;image-rendering:pixelated">`}
function normName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|family|and|mr|mrs|ms|miss|dr|aunt|uncle)\b/g,' ').replace(/\s+/g,' ').trim()}
function findGuest(name){const n=normName(name);if(!n)return null;
  let hit=S.guests.filter(g=>normName(g.name)===n);if(hit.length===1)return hit[0];
  const toks=n.split(' ');hit=S.guests.filter(g=>{const gt=normName(g.name).split(' ').filter(Boolean);return gt.length&&(gt.every(t=>toks.includes(t))||(toks.length>=2&&toks.every(t=>gt.includes(t))))});
  return hit.length===1?hit[0]:null}

function applyRsvp(g,r){const o=strip(g);

  else{o.shower=true;o.showerRsvp=r.attending?'Yes':'No';o.showerParty=r.attending?(num(r.party)||1):0}
  if(r.dietary)o.dietary=r.dietary;
  if(r.contact&&!o.phone&&!o.email){if(r.contact.includes('@'))o.email=r.contact;else o.phone=r.contact}

async function linkRsvp(rid,gid){const r=S.rsvps.find(x=>x.id===rid),g=S.guests.find(x=>x.id===gid);if(!r||!g)return;
  // later answers win: only apply if this is the newest response for that guest + event
  const newer=S.rsvps.some(x=>x.id!==rid&&x.guestId===gid&&x.event===r.event&&(x.createdAt||'')>(r.createdAt||''));
  if(!newer)await save('guests',gid,applyRsvp(g,r));
  await save('rsvps',rid,Object.assign(strip(r),{guestId:gid}))}
async function intakeRsvps(){

      const id=await save('rsvps',x.id,r);if(!id)break;added++;
      const g=findGuest(x.name);if(g){await linkRsvp(x.id,g.id);matched++}}}

async function copyCSV(rows,what){
  const txt=rows.map(r=>r.map(c=>{c=String(c??'');return /[\t\n"]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join('\t')).join('\n');
  try{await navigator.clipboard.writeText(txt);toast(`Copied ${rows.length-1} ${what} — paste into a spreadsheet`)}
  catch(_){showSheet(`<div class="grab"></div><h4>Copy ${what}</h4><p class="note">Select all and copy, then paste into Google Sheets.</p><textarea id="copyta" style="width:100%;min-height:240px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px">${esc(txt)}</textarea><div class="actions"><button class="btn" data-act="copyta">Copy</button><button class="btn ghost" data-act="close">Done</button></div>`)}
}

async function togglePay(id){const p=S.payments.find(x=>x.id===id);if(!p)return;const o=strip(p);o.paid=!p.paid;

/* ---------- spreadsheet import (built-in .xlsx reader) ---------- */
async function readXlsx(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder();
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('not a zip');
  const n=dv.getUint16(e+10,true);let o=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){const fl=dv.getUint16(o+28,true),xl=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true);
    files[td.decode(u8.subarray(o+46,o+46+fl))]={m:dv.getUint16(o+10,true),cs:dv.getUint32(o+20,true),lh:dv.getUint32(o+42,true)};o+=46+fl+xl+cl}
  const get=async name=>{const f=files[name];if(!f)return null;const st=f.lh+30+dv.getUint16(f.lh+26,true)+dv.getUint16(f.lh+28,true),d=u8.subarray(st,st+f.cs);
    if(f.m===0)return td.decode(d);
    const out=await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();return td.decode(out)};
  const P=t=>new DOMParser().parseFromString(t,'application/xml'),tags=(x,t)=>[...x.getElementsByTagNameNS('*',t)];
  const ss=[],sst=await get('xl/sharedStrings.xml');if(sst)tags(P(sst),'si').forEach(si=>ss.push(tags(si,'t').map(t=>t.textContent).join('')));
  const wbx=P(await get('xl/workbook.xml')),rmap={};tags(P(await get('xl/_rels/workbook.xml.rels')),'Relationship').forEach(r=>rmap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const sheets={};
  for(const sh of tags(wbx,'sheet')){
    let tg=rmap[sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')];if(!tg)continue;
    tg=tg.startsWith('/')?tg.slice(1):'xl/'+tg.replace(/^\.\//,'');const txt=await get(tg);if(!txt)continue;
    const rows={};
    tags(P(txt),'c').forEach(c=>{const ref=c.getAttribute('r')||'',m=ref.match(/^([A-Z]+)(\d+)$/);if(!m)return;
      const t=c.getAttribute('t'),v=tags(c,'v')[0],f=tags(c,'f')[0];let val=v?v.textContent:'';
      if(t==='s')val=ss[+val]??'';else if(t==='inlineStr')val=tags(c,'t').map(x=>x.textContent).join('');else if(t==='b')val=val==='1';else if(t!=='str'&&t!=='e'&&val!=='')val=+val;
      (rows[+m[2]]=rows[+m[2]]||{})[m[1]]={v:val,f:f?f.textContent:''}});
    sheets[sh.getAttribute('name')]=rows}
  return sheets}
const str=v=>v==null?'':String(v).trim();
function xdate(v){if(typeof v==='number'){if(v<1)return '';const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
  const t=str(v);if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);const d=new Date(t);return t&&!isNaN(d)&&d.getFullYear()>1950?iso(d):''}
function table(rows,need){const nums=Object.keys(rows).map(Number).sort((a,b)=>a-b);
  const hr=nums.find(r=>str(rows[r].A&&rows[r].A.v).toLowerCase()==='item'&&Object.values(rows[r]).some(c=>str(c.v).toLowerCase().startsWith(need)));
  if(hr==null)return null;const H={};Object.entries(rows[hr]).forEach(([col,c])=>H[str(c.v).toLowerCase()]=col);
  const col=n=>{const k=Object.keys(H).find(h=>h.startsWith(n));return k?H[k]:null};
  return {col,body:nums.filter(r=>r>hr).map(r=>rows[r])}}
async function importXlsx(file){
  if(readOnly){toast('You have view-only access');return}
  toast('Importing…',20000);let book;
  try{book=await readXlsx(await file.arrayBuffer())}catch(_){toast('That file couldn’t be read — save it as .xlsx and try again',5000);return}
  const names=Object.keys(book),bn=names.find(n=>/budget/i.test(n))||names[0],pn=names.find(n=>/payment/i.test(n));
  const brows=book[bn]||{};let gc=null,tb=null;
  Object.values(brows).forEach(r=>{const a=str(r.A&&r.A.v).toLowerCase(),b=r.B&&r.B.v;if(a.includes('guest count'))gc=num(b);if(a.includes('target budget'))tb=num(b)});
  const T=table(brows,'price');if(!T){toast('Couldn’t find the Item / Price header row',5000);return}
  const C={item:T.col('item'),desc:T.col('description'),price:T.col('price'),qty:T.col('quantity'),link:T.col('link'),vendor:T.col('vendor'),cat:T.col('category'),notes:T.col('notes')};
  const v=(r,k)=>k&&r[k]?r[k].v:'';const ids={};let nItems=0,nPays=0;
  for(const r of T.body){const name=str(v(r,C.item));if(!name)continue;
    const qc=C.qty&&r[C.qty],perGuest=!!(qc&&/\$?B\$?3\b/i.test(qc.f||''));const pr=v(r,C.price),q=v(r,C.qty);
    const ex=S.budget.find(b=>(b.name||'').toLowerCase()===name.toLowerCase());
    const data=Object.assign(ex?strip(ex):{phone:'',email:''},{name,description:str(v(r,C.desc)),price:pr===''?'':num(pr),qty:perGuest||q===''?'':num(q),perGuest,
      link:str(v(r,C.link)),vendor:str(v(r,C.vendor)),category:str(v(r,C.cat))||'Other',notes:str(v(r,C.notes))});
    const id=await save('budget',ex?ex.id:null,data);if(id){ids[name.toLowerCase()]=id;nItems++}}
  const PT=pn?table(book[pn],'amount'):null;
  if(PT){const P={item:PT.col('item'),label:PT.col('payment'),amt:PT.col('amount'),due:PT.col('due'),paid:PT.col('paid'),dp:PT.col('date paid'),notes:PT.col('notes')};
    for(const r of PT.body){const iname=str(v(r,P.item)).toLowerCase();if(!iname||v(r,P.amt)==='')continue;
      const itemId=ids[iname]||(S.budget.find(b=>(b.name||'').toLowerCase()===iname)||{}).id;if(!itemId)continue;
      const data={itemId,label:str(v(r,P.label)),amount:num(v(r,P.amt)),due:xdate(v(r,P.due)),paid:/^y/i.test(str(v(r,P.paid))),datePaid:xdate(v(r,P.dp)),notes:str(v(r,P.notes))};
      const ex=S.payments.find(p=>p.itemId===itemId&&(p.label||'')===data.label&&num(p.amount)===data.amount);
      if(await save('payments',ex?ex.id:null,ex?Object.assign(strip(ex),data):data))nPays++}}
  const st={};if(gc)st.guestCount=gc;if(tb)st.budget=tb;if(Object.keys(st).length)await saveSettings(st);
  ui.mview='items';render();toast(`Imported ${nItems} items and ${nPays} payments`,4000);
}

/* ---------- guest list import (Zola export, any CSV / Excel) ---------- */
function parseCSV(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
async function readGuestRows(file){
  if(/\.csv$/i.test(file.name)||file.type==='text/csv')return parseCSV(await file.text());
  const book=await readXlsx(await file.arrayBuffer());const sh=Object.values(book)[0]||{};
  const nums=Object.keys(sh).map(Number).sort((a,b)=>a-b);const colIdx=c=>c.split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
  return nums.map(r=>{const out=[];Object.entries(sh[r]).forEach(([c,v])=>out[colIdx(c)]=v.v);return Array.from(out,x=>x==null?'':String(x))})}
function guestsFromRows(rows){
  const hi=rows.findIndex(r=>r.some(c=>/^(first name|name|guest name|full name)$/i.test(String(c).trim())));if(hi<0)return null;
  const H=rows[hi].map(h=>String(h).trim().toLowerCase());
  const find=(...pats)=>H.findIndex(h=>pats.some(p=>p instanceof RegExp?p.test(h):h===p));
  const C={title:find('title'),first:find('first name'),last:find('last name'),name:find('name','guest name','full name'),
    pFirst:find('partner first name'),pLast:find('partner last name'),
    a1:find('street address','address','address line 1','street address (line 1)','address 1'),a2:find('street address (line 2)','address line 2','address 2','apt / suite'),
    city:find('city'),state:find('state / region','state','state/province','province','region'),zip:find('zip / postal code','zip','zip code','postal code','zip/postal code'),
    email:find('email','email address','e-mail'),phone:find('phone','phone number','mobile','cell'),
    group:find('group','tags','relationship','affiliation','category','list')};
  const kids=H.map((h,i)=>/^child \d+ (first )?name$/.test(h)?i:-1).filter(i=>i>=0);
  const plus=find(/plus.?one/);
  const v=(r,i)=>i<0?'':String(r[i]??'').trim();
  const out=[];
  for(const r of rows.slice(hi+1)){
    const f=v(r,C.first),l=v(r,C.last),pf=v(r,C.pFirst),pl=v(r,C.pLast);
    let name=v(r,C.name);
    if(!name&&(f||l)){name=pf?(l&&(!pl||pl===l)?`${f} & ${pf} ${l}`:`${[f,l].filter(Boolean).join(' ')} & ${[pf,pl].filter(Boolean).join(' ')}`):[f,l].filter(Boolean).join(' ')}
    if(!name)continue;
    let size=1+(pf||pl?1:0)+kids.filter(i=>v(r,i)).length;const pv=v(r,plus).toLowerCase();if(pv&&/^(y|yes|true|1|\+1)/.test(pv))size++;
    out.push({name,size,addr:[v(r,C.a1),v(r,C.a2)].filter(Boolean).join(', '),city:v(r,C.city),state:v(r,C.state),zip:v(r,C.zip),email:v(r,C.email),phone:v(r,C.phone),group:v(r,C.group)})}
  return out}
let pendingGuests=null;
async function prepGuestImport(file){
  let rows;try{rows=await readGuestRows(file)}catch(_){toast('That file couldn’t be read',4000);return}
  const list=guestsFromRows(rows||[]);if(!list){toast('Couldn’t find a Name or First Name column in that file',5000);return}
  if(!list.length){toast('No guests found in that file');return}
  pendingGuests=list;const upd=list.filter(g=>S.guests.some(x=>normName(x.name)===normName(g.name))).length;
  showSheet(`<div class="grab"></div><h4>Import ${list.length} guest${list.length>1?'s':''}</h4>
   <p class="note">${list.length-upd} new${upd?`, ${upd} already on your list (their address and contact info will be filled in or updated — RSVPs and notes stay as they are)`:''}.</p>
   <div class="card" style="max-height:220px;overflow:auto;padding:8px 14px">${list.slice(0,40).map(g=>`<div style="padding:6px 0;border-top:1px solid var(--line);font-size:14px"><b style="font-weight:500">${esc(g.name)}</b>${g.size>1?` (${g.size})`:''}<div style="font-size:12px;color:var(--muted)">${esc([g.addr,g.city,g.state,g.zip].filter(Boolean).join(', ')||'No address')}</div></div>`).join('')}${list.length>40?`<div class="note">…and ${list.length-40} more</div>`:''}</div>
   <div class="f cb"><input type="checkbox" id="gi_w" checked><label for="gi_w">Invite new guests to the wedding</label></div>
   <div class="f cb"><input type="checkbox" id="gi_s"><label for="gi_s">Invite new guests to the bridal shower</label></div>
   <div class="actions"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="doimport">Import</button></div>`)}
async function doGuestImport(btn){
  const list=pendingGuests;if(!list)return;const w=$('#gi_w').checked,sh=$('#gi_s').checked;btn.disabled=true;
  let added=0,updated=0;
  for(const g of list){btn.textContent=`Importing ${added+updated+1} of ${list.length}…`;
    const ex=S.guests.find(x=>normName(x.name)===normName(g.name));
    if(ex){const o=strip(ex);['addr','city','state','zip','email','phone','group'].forEach(k=>{if(g[k])o[k]=g[k]});if(!num(o.size)||num(g.size)>num(o.size))o.size=g.size;
      if(await save('guests',ex.id,o))updated++}
    else{if(await save('guests',null,{name:g.name,size:g.size,side:'Both / friends',group:g.group,addr:g.addr,city:g.city,state:g.state,zip:g.zip,phone:g.phone,email:g.email,
        wedding:w,shower:sh,std:false,invite:false,rsvp:'Pending',showerRsvp:'Pending',meal:'',dietary:'',gift:'',thanks:false,notes:'From guest list import'}))added++;else break}}
  pendingGuests=null;closeSheet();toast(`Added ${added}${updated?`, updated ${updated}`:''} guest${added+updated===1?'':'s'}`,4000)}
